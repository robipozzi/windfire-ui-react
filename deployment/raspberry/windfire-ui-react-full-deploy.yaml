--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# Software installation and configuration
- hosts: frontend
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
    vite_keycloak_url: "{{ lookup('env', 'VITE_KEYCLOAK_URL') }}"
    vite_keycloak_realm: "{{ lookup('env', 'VITE_KEYCLOAK_REALM') }}"
    vite_keycloak_client_id: "{{ lookup('env', 'VITE_KEYCLOAK_CLIENT_ID') }}"
    vite_restaurants_url: "{{ lookup('env', 'VITE_RESTAURANTS_URL') | default('https://raspberry02:8081/restaurants', true) }}"
  vars_files:
    - "{{ src_dir }}/conf/config.yaml"
  pre_tasks:
    ###############################################
    ##### Update package manager repositories #####
    ###############################################
    - name: Update package manager repositories cache
      apt:
        update_cache: yes
    ######################################
    ##### Upgrade installed packages #####
    ######################################
    - name: Upgrade installed packages
      apt:
        upgrade: dist
    - name: Remove useless packages from the cache
      apt:
        autoclean: yes
    - name: Remove dependencies that are no longer required
      apt:
        autoremove: yes
    ###########################
    ##### Openssl Section #####
    ###########################
    - name: Install Openssl
      apt:
        name: openssl
        state: present
    ###########################
    ##### Node.js Section #####
    ###########################
    - name: Install Node.js repository prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    - name: Download NodeSource repository signing key
      get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"
    - name: Add NodeSource Node.js {{ nodejs_version }} repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main"
        filename: nodesource
        update_cache: yes
    - name: Install Node.js
      apt:
        name: nodejs
        state: latest
  tasks:
    ##################################################################
    ##### Windfire UI React frontend component deployment Section #####
    ##################################################################
    - import_tasks: tasks/deploy-app.yaml
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
