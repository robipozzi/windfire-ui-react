--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# Software installation and configuration
- hosts: frontend
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
    vite_keycloak_url: "{{ lookup('env', 'VITE_KEYCLOAK_URL') }}"
    vite_keycloak_realm: "{{ lookup('env', 'VITE_KEYCLOAK_REALM') }}"
    vite_keycloak_client_id: "{{ lookup('env', 'VITE_KEYCLOAK_CLIENT_ID') }}"
    vite_restaurants_url: "{{ lookup('env', 'VITE_RESTAURANTS_URL') | default('https://raspberry02:8081/restaurants', true) }}"
  vars_files:
    - "{{ src_dir }}/conf/config.yaml"
  tasks:
    ##################################################################
    ##### Windfire UI React frontend component deployment Section #####
    ##################################################################
    - import_tasks: tasks/deploy-app.yaml
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
