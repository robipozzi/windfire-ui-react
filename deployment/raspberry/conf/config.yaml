user: pi
group: pi
local_home_dir: "{{ lookup('env', 'HOME') }}"
local_ssl_dir: "{{ local_home_dir }}/opt/windfire/ssl"
local_truststore_dir: "{{ local_ssl_dir }}/truststore"
local_certs_dir: "{{ local_ssl_dir }}/certs/raspberry"
remote_home_dir: /home/pi
remote_ssl_dir: "{{ remote_home_dir }}/opt/windfire/ssl"
remote_truststore_dir: "{{ remote_ssl_dir }}/truststore"
windfire_ca_root_certificate: "WindfireRootCA.crt"
# Exported by deploy.sh, which asks for the filenames; the fallbacks match the defaults in commons.sh
windfire_server_certificate: "{{ lookup('env', 'WINDFIRE_SERVER_CERTIFICATE') | default('windfire-ui.crt', true) }}"
windfire_server_key: "{{ lookup('env', 'WINDFIRE_SERVER_KEY') | default('windfire-ui.key', true) }}"
local_windfire_ui_react_dir: "{{ playbook_dir }}/../.."
remote_windfire_ui_react_dir: "{{ remote_home_dir }}/windfire-ui-react"
# Node.js runtime: installed from NodeSource by windfire-ui-react-full-deploy.yaml, checked by every deploy
nodejs_version: "26.x"
node_min_major: 26
# systemd service and application (.env) configuration
service_name: windfire-ui-react
app_description: Windfire UI React
# Keycloak (8443) and windfire-security (8444) already listen on raspberry01; nginx may own 80/443
https_port: 9443
# No HTTP -> HTTPS redirect listener: only the HTTPS port is opened
http_redirect: "false"
health_check_host: raspberry01
