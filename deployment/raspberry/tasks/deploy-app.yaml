---
# Windfire UI React deployment tasks, shared by windfire-ui-react-deploy.yaml and windfire-ui-react-full-deploy.yaml.
# The play runs with become (root): tasks that write under the pi home folder either set owner/group
# or run as the connecting user with "become: false", so parent folders are never created as root.
# The application is staged as pi (rsync and npm ci run as the connecting user), then the whole
# application folder is handed over to the service user before the service starts.

# Task 0: Check that deploy.sh exported the application configuration and built the React application
- name: Check application configuration is set
  ansible.builtin.assert:
    that:
      - vite_keycloak_url | length > 0
      - vite_keycloak_realm | length > 0
      - vite_keycloak_client_id | length > 0
      - vite_restaurants_url | length > 0
    fail_msg: "VITE_KEYCLOAK_URL, VITE_KEYCLOAK_REALM, VITE_KEYCLOAK_CLIENT_ID and VITE_RESTAURANTS_URL must be exported (run deployment/deploy.sh)"
    quiet: true

# Public or LAN-only access, as recorded on the Pi by windfire-raspberry's switch-windfire-exposure.sh
# (/etc/ansible/facts.d/windfire.fact, read as ansible_local.windfire.exposure; no file means public). A bundle built
# for the other mode would send browsers to a Keycloak hostname whose tokens no service accepts.
- name: Check the bundle's Keycloak URL matches the recorded exposure mode
  ansible.builtin.fail:
    msg: >-
      Windfire is {{ windfire_exposure }} (recorded by windfire-raspberry switch-windfire-exposure.sh), but this build
      uses VITE_KEYCLOAK_URL={{ vite_keycloak_url }} instead of {{ windfire_exposure_keycloak_url }}: run
      deploy.sh again with --profile {{ windfire_exposure }}, or switch Windfire with ./switch-windfire-exposure.sh
  vars:
    windfire_exposure: "{{ ansible_local.windfire.exposure | default('public') }}"
    windfire_exposure_keycloak_url: "{{ deployment_profiles[windfire_exposure].vite_keycloak_url | default('') }}"
  when: windfire_exposure_keycloak_url | length > 0 and vite_keycloak_url != windfire_exposure_keycloak_url

# Both profiles use the production realm. windfire-dev (the local .env's realm) keeps its login on the LAN for local
# development only: its users are its own and no deployed service accepts its tokens.
- name: Check the bundle's Keycloak realm is the production realm
  ansible.builtin.fail:
    msg: >-
      This build uses VITE_KEYCLOAK_REALM={{ vite_keycloak_realm }}, but a Raspberry deploy must use the production
      realm {{ windfire_keycloak_realm }} (windfire-dev is for local development only): run deploy.sh again and
      accept the profile's realm
  when: vite_keycloak_realm != windfire_keycloak_realm

- name: Check local React build {{ local_windfire_ui_react_dir }}/dist exists
  ansible.builtin.stat:
    path: "{{ local_windfire_ui_react_dir }}/dist/index.html"
  register: local_build
  delegate_to: localhost
  become: false

- name: Fail if local React build is missing
  ansible.builtin.fail:
    msg: "{{ local_windfire_ui_react_dir }}/dist/index.html not found: run deployment/deploy.sh, which builds the application"
  when: not local_build.stat.exists

# Task 0b: Check the shared CA certificates before the running service is touched: windfire-raspberry
# (configure-windfire-infra.sh --tags windfire_ca) owns {{ windfire_ca_dir }}, this playbook never writes it.
# The service makes no outbound TLS call: only the health check uses the Windfire Root CA.
- name: Check the shared CA folder {{ windfire_ca_dir }} and certificates
  stat:
    path: "{{ item }}"
  loop:
    - "{{ windfire_ca_dir }}"
    - "{{ windfire_ca_dir }}/{{ windfire_ca_root_certificate }}"
    - "{{ windfire_ca_dir }}/{{ windfire_ca_keycloak_certificate }}"
  register: windfire_ca_stat

- name: Fail if the shared CA folder or a CA certificate is missing or writable by anyone but root
  fail:
    msg: >-
      {{ item.item }} on {{ inventory_hostname }} is missing or not root:root
      {{ '0755' if item.item == windfire_ca_dir else '0644' }}: run ./configure-windfire-infra.sh --tags windfire_ca in windfire-raspberry first
  when: >-
    not item.stat.exists
    or item.stat.pw_name != 'root' or item.stat.gr_name != 'root'
    or (item.item == windfire_ca_dir and (not item.stat.isdir or item.stat.mode != '0755'))
    or (item.item != windfire_ca_dir and (not item.stat.isreg or item.stat.mode != '0644'))
  loop: "{{ windfire_ca_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check each CA certificate in {{ windfire_ca_dir }} is a valid certificate
  command: "openssl x509 -noout -in {{ windfire_ca_dir }}/{{ item }}"
  changed_when: false
  check_mode: false
  loop:
    - "{{ windfire_ca_root_certificate }}"
    - "{{ windfire_ca_keycloak_certificate }}"

# Task 0c: Check, before the running service is touched, that the Keycloak client accepts the redirect URI browsers will
# use (keycloak-js sends the page URL, <app_url>/ on the first login). The authorization endpoint answers an allowed
# redirect URI with its login page (200) and anything else with an error page (400): no credentials are needed.
# Asked on the LAN URL in both modes, from raspberry01, because the public hostname sits behind Cloudflare Access.
# The code_challenge is a fixed S256 value, so a client that requires PKCE still shows its login page.
- name: Check the Keycloak client accepts the UI's redirect URI
  uri:
    url: >-
      {{ keycloak_internal_url }}/realms/{{ vite_keycloak_realm | urlencode }}/protocol/openid-connect/auth?client_id={{
      vite_keycloak_client_id | urlencode }}&redirect_uri={{ ui_redirect_uri | urlencode }}&response_type=code&scope=openid&code_challenge_method=S256&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
    ca_path: "{{ windfire_ca_dir }}/{{ windfire_ca_keycloak_certificate }}"
    follow_redirects: none
    status_code: [200, 302, 400, 404]
  vars:
    ui_redirect_uri: "{{ deployment_profiles[ansible_local.windfire.exposure | default('public')].app_url }}/"
  register: keycloak_redirect_check
  changed_when: false
  check_mode: false
  become: false

- name: Fail if the Keycloak client refuses the UI's redirect URI
  fail:
    msg: >-
      Keycloak ({{ keycloak_internal_url }}) answered {{ keycloak_redirect_check.status }} to client
      {{ vite_keycloak_client_id }} in realm {{ vite_keycloak_realm }} with redirect URI {{ ui_redirect_uri }}:
      {{ 'the realm does not exist' if keycloak_redirect_check.status == 404 else
         'add ' ~ ui_redirect_uri ~ ' to the Valid redirect URIs of the client and its origin to Web origins (or +), or check the client id' }}
  vars:
    ui_redirect_uri: "{{ deployment_profiles[ansible_local.windfire.exposure | default('public')].app_url }}/"
  when: >-
    not (keycloak_redirect_check.status == 200
         or (keycloak_redirect_check.status == 302
             and (keycloak_redirect_check.location | default('')).startswith(ui_redirect_uri)))

# Task 1: Check Node.js runtime on remote server
- name: Get Node.js version on remote server
  command: node --version
  register: node_version
  changed_when: false
  failed_when: false
  become: false

- name: Check Node.js {{ node_min_major }} or later is installed
  ansible.builtin.assert:
    that:
      - node_version.rc == 0
      - (node_version.stdout | regex_replace('^v', '')).split('.')[0] | int >= node_min_major
    fail_msg: "Node.js {{ node_min_major }}+ not found on {{ inventory_hostname }} ({{ node_version.stdout | default('not installed', true) }}): run deployment/deploy.sh --full"
    success_msg: "Node.js {{ node_version.stdout }} found"

# Task 1b: Create the system user the service runs as
- name: Create "{{ service_group }}" system group
  ansible.builtin.group:
    name: "{{ service_group }}"
    system: yes
    state: present

- name: Create "{{ service_user }}" system user (no login shell, no supplementary groups)
  ansible.builtin.user:
    name: "{{ service_user }}"
    group: "{{ service_group }}"
    groups: ""
    append: no
    system: yes
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: no
    state: present

# {{ remote_home_dir }} is 0700: let the service user traverse it (no read/list) to reach the application folder
- name: Allow "{{ service_user }}" to traverse {{ remote_home_dir }}
  ansible.posix.acl:
    path: "{{ remote_home_dir }}"
    entity: "{{ service_user }}"
    etype: user
    permissions: x
    state: present

# Task 2: Stop Windfire UI React service on remote server
- name: Stop "{{ service_name }}" systemd service if running
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: stopped
  failed_when: false

# Task 3: Recreate Windfire UI React directory on remote server
- name: Remove "{{ remote_windfire_ui_react_dir }}" folder and all its contents on remote server
  ansible.builtin.file:
    path: "{{ remote_windfire_ui_react_dir }}"
    state: absent

- name: Create "{{ remote_windfire_ui_react_dir }}" folder and its logs subfolder on remote server
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"
  loop:
    - "{{ remote_windfire_ui_react_dir }}"
    - "{{ remote_windfire_ui_react_dir }}/logs"

- name: Create "{{ remote_windfire_ui_react_dir }}/ssl" folder, accessible only by {{ service_user }}
  ansible.builtin.file:
    path: "{{ remote_windfire_ui_react_dir }}/ssl"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0500"

# Task 4: Copy React build and production server to remote server
# Only what the production server needs: no sources, node_modules, local .env or local certificates
- name: Copy React build to "{{ remote_windfire_ui_react_dir }}" directory on remote server
  ansible.builtin.synchronize:
    src: "{{ local_windfire_ui_react_dir }}/dist"
    dest: "{{ remote_windfire_ui_react_dir }}"
  become: false

- name: Copy production server and package files to "{{ remote_windfire_ui_react_dir }}" directory on remote server
  copy:
    src: "{{ local_windfire_ui_react_dir }}/{{ item }}"
    dest: "{{ remote_windfire_ui_react_dir }}/{{ item }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"
  loop:
    - server.js
    - package.json
    - package-lock.json

# Task 5: Template application configuration
- name: Template "{{ remote_windfire_ui_react_dir }}/.env" configuration file
  ansible.builtin.template:
    src: "{{ src_dir }}/templates/windfire-ui-react.env.j2"
    dest: "{{ remote_windfire_ui_react_dir }}/.env"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0600"

# Task 6: Copy TLS material to remote server: the service user's own copy of the certificate and key
# (no CA certificate is copied: the health check reads the shared {{ windfire_ca_dir }})
- name: Copy certificate {{ windfire_server_certificate }} from {{ local_certs_dir }} to "{{ remote_windfire_ui_react_dir }}/ssl" directory on remote server
  copy:
    src: "{{ local_certs_dir }}/{{ windfire_server_certificate }}"
    dest: "{{ remote_windfire_ui_react_dir }}/ssl/{{ windfire_server_certificate }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0444"

- name: Copy key {{ windfire_server_key }} from {{ local_certs_dir }} to "{{ remote_windfire_ui_react_dir }}/ssl" directory on remote server
  copy:
    src: "{{ local_certs_dir }}/{{ windfire_server_key }}"
    dest: "{{ remote_windfire_ui_react_dir }}/ssl/{{ windfire_server_key }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0400"

# Task 7: Install production Node.js modules
- name: Install production Node.js modules with npm ci
  command:
    cmd: npm ci --omit=dev --no-audit --no-fund
    chdir: "{{ remote_windfire_ui_react_dir }}"
  become: false

# Task 7b: Hand the application folder over to the service user (owner/group only: file modes are kept)
- name: Change owner of "{{ remote_windfire_ui_react_dir }}" and its contents to {{ service_user }}
  ansible.builtin.file:
    path: "{{ remote_windfire_ui_react_dir }}"
    state: directory
    recurse: yes
    owner: "{{ service_user }}"
    group: "{{ service_group }}"

# Task 8: Install systemd unit
- name: Template Windfire UI React systemd unit
  template:
    src: "{{ src_dir }}/templates/windfire-ui-react.service.j2"
    dest: "/etc/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

# Task 9: Start Windfire UI React service
- name: Reload systemd, enable and start "{{ service_name }}" service
  systemd:
    daemon_reload: yes
    name: "{{ service_name }}"
    state: started
    enabled: yes

# Task 10: Post-deploy health check
- name: Check Windfire UI React service health
  block:
    - name: Verify Windfire UI React is listening on port {{ https_port }}
      wait_for:
        port: "{{ https_port }}"
        host: 127.0.0.1
        timeout: 30

    - name: Call https://{{ health_check_host }}:{{ https_port }}/
      uri:
        url: "https://{{ health_check_host }}:{{ https_port }}/"
        ca_path: "{{ windfire_ca_dir }}/{{ windfire_ca_root_certificate }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 5
      delay: 3
  rescue:
    - name: Get "{{ service_name }}" journal entries
      command: "journalctl -u {{ service_name }} -n 50 --no-pager"
      register: service_journal
      changed_when: false
      failed_when: false

    - name: Get "{{ service_name }}" log file tail
      command: "tail -n 50 {{ remote_windfire_ui_react_dir }}/logs/{{ service_name }}.log"
      register: service_log
      changed_when: false
      failed_when: false

    - name: Display "{{ service_name }}" diagnostics
      debug:
        msg:
          journal: "{{ service_journal.stdout_lines }}"
          log: "{{ service_log.stdout_lines }}"

    - name: Fail deployment
      fail:
        msg: "{{ service_name }} did not pass the health check, see diagnostics above"
